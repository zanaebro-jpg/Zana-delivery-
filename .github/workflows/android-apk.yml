name: Prepare and Build Zana Delivery APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify Flutter project files
        run: test -f pubspec.yaml && test -f lib/main.dart

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        run: flutter create --platforms=android .

      - name: Ensure Android internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\\n'
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest', '<manifest', 1)
              pos = s.find('>') + 1
              s = s[:pos] + '\\n' + permission + s[pos:]
              p.write_text(s)
          print('INTERNET permission verified in', p)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zana-delivery-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
