name: Build Zana Delivery APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract Zana project ZIP
        run: |
          ARCHIVE=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -o "$ARCHIVE" -d extracted
          cp -a extracted/. .
          test -f pubspec.yaml

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        run: flutter create --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: zana-delivery-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
