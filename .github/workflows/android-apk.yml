name: Prepare and Build Zana Delivery APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify Flutter project files
        run: test -f pubspec.yaml && test -f lib/main.dart

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zana-delivery-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
