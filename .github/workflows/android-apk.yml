name: Prepare and Build Zana Delivery APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract Flutter source into repository
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="Zana_Delivery_Modified_Starter.zip"
          test -f "$ARCHIVE" || { echo "Missing $ARCHIVE"; exit 1; }
          mkdir -p /tmp/zana-extract
          unzip -oq "$ARCHIVE" -d /tmp/zana-extract
          PUBSPEC="$(find /tmp/zana-extract -name pubspec.yaml -type f -print -quit)"
          test -n "$PUBSPEC" || { echo "pubspec.yaml not found in ZIP"; find /tmp/zana-extract -maxdepth 3 -type f | head -80; exit 1; }
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "Flutter project found at: $PROJECT_DIR"
          rsync -a --delete --exclude='.git/' --exclude='.github/' "$PROJECT_DIR/" ./
          test -f pubspec.yaml
          echo "Flutter source files extracted."

      - name: Commit extracted source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Prepare Flutter source files from starter archive"
            git push
          fi

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zana-delivery-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
